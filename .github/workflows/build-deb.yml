name: Build .deb

# Cross-compiles the CardputerZero app for aarch64 and publishes the Debian
# package as a build artifact. Runs on pushes/PRs and on demand; tags also get
# the .deb attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for attaching the .deb to a Release on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build crossbuild-essential-arm64 dpkg-dev ca-certificates git
          # The workflow preset requires CMake >= 3.31; Ubuntu ships older. pipx
          # (preinstalled on the runner) sidesteps PEP 668 and puts a current
          # cmake/cpack on PATH without needing a venv.
          pipx install cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          aarch64-linux-gnu-gcc --version | head -1

      # The first build downloads the device BSP (~public GitHub release) and
      # LVGL/fmt; cache them so later runs are fast. Keyed on the files that
      # pin those versions.
      - name: Cache BSP / deps
        uses: actions/cache@v4
        with:
          path: .cache
          key: cp0-cache-${{ hashFiles('cmake/toolchains/cp0-aarch64-linux-gnu.cmake', 'CMakeLists.txt') }}
          restore-keys: cp0-cache-

      - name: Configure, build and package
        run: cmake --workflow --preset cp0-cross-package

      - name: Locate the package
        id: pkg
        run: echo "path=$(ls -t dist/BruceCardputerZero_*_arm64.deb | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BruceCardputerZero-arm64-deb
          path: dist/BruceCardputerZero_*_arm64.deb
          if-no-files-found: error

      - name: Attach .deb to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.path }}
